name: 정보 오류 신고
description: 사이트에 표시된 지원 정보가 공식 페이지와 다를 때 알려 주세요.
title: "[정보 오류] "
labels: ["data-report"]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다. 확인 후 공공데이터를 잘못 해석한 부분이면 고치겠습니다.

        **이 신고는 GitHub에 누구나 볼 수 있게 공개됩니다. 이름, 연락처, 주민등록번호 등 개인정보는 적지 마세요.**

        공공데이터 원본이 틀린 경우에는 해당 기관에서 고쳐야 해서 이 사이트에서 바로 바꾸지 못할 수 있습니다.
  - type: input
    id: policy_name
    attributes:
      label: 지원 이름
    validations:
      required: true
  - type: input
    id: policy_id
    attributes:
      label: 서비스 번호
      description: 자동으로 채워집니다. 바꾸지 마세요.
  - type: input
    id: page_url
    attributes:
      label: 이 사이트의 페이지 주소
  - type: input
    id: official_url
    attributes:
      label: 공식 페이지 주소
  - type: dropdown
    id: wrong_part
    attributes:
      label: 어느 부분이 다른가요?
      options:
        - 지원 대상
        - 선정 기준·소득 조건
        - 지원 금액
        - 신청 기한·마감 여부
        - 신청 방법·필요 서류
        - 지역 (시·군·구)
        - 신청 사이트 주소
        - 기타
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 무엇이 다른가요?
      description: 이 사이트에 적힌 내용과, 공식 페이지에서 확인한 내용을 함께 적어 주세요.
      placeholder: 예) 사이트에는 "월 20만원"이라고 되어 있는데 공식 페이지에는 "월 30만원"입니다.
    validations:
      required: true
