name: Build and deploy

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOV24_SERVICE_KEY: ${{ secrets.GOV24_SERVICE_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pipeline tests
        working-directory: pipeline
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      # 검증 게이트에 실패하면 여기서 중단되어 기존에 배포된 사이트가 그대로 유지된다
      - name: Build data index
        working-directory: pipeline
        run: python build_index.py

      - name: Build static pages
        working-directory: pipeline
        run: python build_pages.py

      - name: Web tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=${{ vars.CF_PROJECT_NAME }}
